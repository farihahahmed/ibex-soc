name: verify

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Per-block lint
        run: ./scripts/lint_blocks.sh

  # Full cocotb gate. No allowed-to-fail legs: every test must pass.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Run exit gate
        working-directory: verification/cocotb
        run: |
          export PYTHONPATH="$(pwd):${PYTHONPATH}"
          ./run_all_verify.sh

  # Gate-level simulation of the signoff netlist. Proves the netlist that
  # becomes silicon actually boots and drives its pins - not just the RTL.
  # PDK cell models are vendored under verification/gl/pdk_models so this
  # runs without a PDK install.
  gate-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Gate-level smoke
        run: make -C verification/gl gl-smoke

  # Bounded model checking: 46 properties across 8 targets. Proves the
  # properties hold for ALL input sequences up to the bound, not just the
  # stimulus a testbench applies.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Yosys and SMT solver
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys z3
          which yosys yosys-smtbmc z3
      - name: Formal suite
        working-directory: verification/formal
        run: |
          # 46 properties across 8 targets: run_formal.py covers 42/7
          # (fsm, lockout, pcpi, gather, bridge, shim, fabric); scan_chain
          # formal adds the 8th target (4 props). test_fsm formal is a
          # duplicate of the fsm target, so it is not run here.
          SMT_SOLVER=z3 python3 run_formal.py
          SMT_SOLVER=z3 python3 run_scan_chain_formal.py

  # RTL line-coverage floor. Enforces the committed lcov artifact
  # (verification/coverage/coverage.info, picorv32/GF180/SRAM excluded as
  # third-party IP) against a floor. Coverage is enforced, not just reported;
  # a regression below the floor fails CI. Regenerate the artifact with
  # `make -C verification/cocotb coverage-run`.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce coverage floor
        working-directory: verification/cocotb
        run: python3 check_coverage_floor.py --floor 85
