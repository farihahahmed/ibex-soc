# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "PicoRV32 SoC on GF180MCU"
  team: "A45 - ColumbiaGals"
  discord: "farihah__ahmed"
  description: "RISC-V RV32IMC SoC: PicoRV32 core, narrow 8-bit SRAM, AHB-Lite/APB bus, GPIO/UART/SPI, scan-configured control"
  lvs_config: "lvs_config.json"

pins:
  - name: VSS
    io_type: ground
  - name: clk
    io_type: input_schmitt
  - name: clk_int
    io_type: input_cmos
  - name: rst_n
    io_type: input_schmitt
  - name: scan_in
    io_type: input_cmos
  - name: scan_shift
    io_type: input_cmos
  - name: scan_load
    io_type: input_cmos
  - name: scan_i0o1
    io_type: input_cmos
  - name: scan_out
    io_type: bidirectional
  - name: "gpio_out[0]"
    io_type: bidirectional
  - name: "gpio_out[1]"
    io_type: bidirectional
  - name: "gpio_out[2]"
    io_type: bidirectional
  - name: "gpio_out[3]"
    io_type: bidirectional
  - name: "gpio_out[4]"
    io_type: bidirectional
  - name: "gpio_in[0]"
    io_type: input_cmos
  - name: "gpio_in[1]"
    io_type: input_cmos
  - name: uart_tx
    io_type: bidirectional
  - name: uart_rx
    io_type: input_cmos
  - name: spi_sclk
    io_type: bidirectional
  - name: spi_mosi
    io_type: bidirectional
  - name: spi_cs_n
    io_type: bidirectional
  - name: VDD
    io_type: power
