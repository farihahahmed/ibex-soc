<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
<style>
.pad{fill:#f5f5f0;stroke:#cfcabd;stroke-width:1;}
.pin{font:11px monospace;fill:#2b2b28;}
.grp{font:italic 10px sans-serif;fill:#8a8578;}
.die{fill:#eceadf;stroke:#3a6ea5;stroke-width:1.5;}
.dietext{font:600 13px sans-serif;fill:#2b2b28;}
.sub{font:10px sans-serif;fill:#8a8578;}
.pwr{fill:#dfe8f2;stroke:#3a6ea5;stroke-width:1;}
</style>
<rect x="180" y="120" width="280" height="280" rx="6" class="die"/>
<text x="320" y="250" text-anchor="middle" class="dietext">Ibex SoC</text>
<text x="320" y="270" text-anchor="middle" class="sub">GF180MCU 180nm</text>
<text x="320" y="286" text-anchor="middle" class="sub">RV32IMC + 4KB SRAM</text>
<text x="320" y="302" text-anchor="middle" class="sub">GPIO / UART / SPI</text>
<text x="120" y="112" text-anchor="middle" class="grp">clock / reset / scan / FSM</text>
<rect x="70" y="128" width="100" height="20" class="pad"/><text x="76" y="142" class="pin">clk</text>
<rect x="70" y="154" width="100" height="20" class="pad"/><text x="76" y="168" class="pin">rst_n</text>
<rect x="70" y="180" width="100" height="20" class="pad"/><text x="76" y="194" class="pin">scan_in</text>
<rect x="70" y="206" width="100" height="20" class="pad"/><text x="76" y="220" class="pin">scan_shift</text>
<rect x="70" y="232" width="100" height="20" class="pad"/><text x="76" y="246" class="pin">scan_load</text>
<rect x="70" y="258" width="100" height="20" class="pad"/><text x="76" y="272" class="pin">scan_out</text>
<rect x="70" y="284" width="100" height="20" class="pad"/><text x="76" y="298" class="pin">start</text>
<rect x="70" y="310" width="100" height="20" class="pad"/><text x="76" y="324" class="pin">load_done</text>
<text x="530" y="112" text-anchor="middle" class="grp">peripherals</text>
<rect x="470" y="128" width="100" height="20" class="pad"/><text x="476" y="142" class="pin">gpio[0]</text>
<rect x="470" y="152" width="100" height="20" class="pad"/><text x="476" y="166" class="pin">gpio[1]</text>
<rect x="470" y="176" width="100" height="20" class="pad"/><text x="476" y="190" class="pin">gpio[2]</text>
<rect x="470" y="200" width="100" height="20" class="pad"/><text x="476" y="214" class="pin">gpio[3]</text>
<rect x="470" y="224" width="100" height="20" class="pad"/><text x="476" y="238" class="pin">uart_tx</text>
<rect x="470" y="248" width="100" height="20" class="pad"/><text x="476" y="262" class="pin">uart_rx</text>
<rect x="470" y="272" width="100" height="20" class="pad"/><text x="476" y="286" class="pin">spi_sclk</text>
<rect x="470" y="296" width="100" height="20" class="pad"/><text x="476" y="310" class="pin">spi_mosi</text>
<rect x="470" y="320" width="100" height="20" class="pad"/><text x="476" y="334" class="pin">spi_miso</text>
<rect x="470" y="344" width="100" height="20" class="pad"/><text x="476" y="358" class="pin">spi_cs_n</text>
<rect x="200" y="90" width="90" height="20" class="pwr"/><text x="206" y="104" class="pin">VDD_core</text>
<rect x="350" y="90" width="90" height="20" class="pwr"/><text x="356" y="104" class="pin">VDD_io</text>
<rect x="200" y="410" width="90" height="20" class="pwr"/><text x="212" y="424" class="pin">VSS_core</text>
<rect x="350" y="410" width="90" height="20" class="pwr"/><text x="366" y="424" class="pin">VSS_io</text>
<text x="320" y="460" text-anchor="middle" class="grp">18 signal pads + 4 power = 22 pads total</text>
<text x="320" y="478" text-anchor="middle" class="sub">GPIO shown as 4 of NUM_IO; SPI pins route to pads for an external LCD/LED</text>
</svg>
